<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Sadya - Lunch Slot Allocator</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --kasavu-gold: #D4AF37;
      --cream-white: #FCFBF7;
      --deep-gold: #B8860B;
      --marigold-orange: #E65100;
      --marigold-yellow: #FFB300;
      --leaf-green: #2E7D32;
      --full-red: #C62828;
      --text-dark: #332A15;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--cream-white);
      color: var(--text-dark);
      margin: 0;
      padding: 16px;
      text-align: center;
      /* Subtle Kasavu pattern accent at top */
      border-top: 8px solid var(--kasavu-gold);
    }

    .header-container {
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--kasavu-gold);
    }

    .festive-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--marigold-orange);
      margin: 8px 0 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--leaf-green);
      margin: 0;
    }

    .slot-card {
      background: white;
      border-radius: 16px;
      padding: 20px 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
      border: 2px solid var(--kasavu-gold);
      position: relative;
      overflow: hidden;
    }

    /* Decorative corner accent */
    .slot-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--marigold-yellow), var(--marigold-orange), var(--leaf-green));
    }

    .slot-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .count-display {
      font-size: 15px;
      margin-bottom: 16px;
      color: #555;
    }

    .remaining {
      font-weight: 800;
      font-size: 18px;
      color: var(--leaf-green);
    }

    .remaining.full {
      color: var(--full-red);
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--marigold-yellow), var(--marigold-orange));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(230, 81, 0, 0.3);
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #E0E0E0;
      color: #9E9E9E;
      box-shadow: none;
      cursor: not-allowed;
      border: 1px solid #CCC;
    }

    .footer-note {
      font-size: 12px;
      color: #888;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="subtitle">🌼 Happy Onam 🌼</div>
    <div class="festive-title">Onam Sadya Tokens</div>
  </div>

  <div class="slot-card">
    <div class="slot-title">12:30 PM Batch</div>
    <div class="count-display">
      <span id="rem-12:30" class="remaining">100</span> slots left (<span id="count-12:30">0</span>/100)
    </div>
    <button id="btn-12:30" onclick="assignSlot('12:30')">+ Assign 12:30 PM Slot</button>
  </div>

  <div class="slot-card">
    <div class="slot-title">1:00 PM Batch</div>
    <div class="count-display">
      <span id="rem-1:00" class="remaining">100</span> slots left (<span id="count-1:00">0</span>/100)
    </div>
    <button id="btn-1:00" onclick="assignSlot('1:00')">+ Assign 1:00 PM Slot</button>
  </div>

  <div class="slot-card">
    <div class="slot-title">1:30 PM Batch</div>
    <div class="count-display">
      <span id="rem-1:30" class="remaining">100</span> slots left (<span id="count-1:30">0</span>/100)
    </div>
    <button id="btn-1:30" onclick="assignSlot('1:30')">+ Assign 1:30 PM Slot</button>
  </div>

  <div class="footer-note">Live Real-time Counter • Staff Dashboard</div>

  <script>
    const socket = io();

    function assignSlot(slot) {
      socket.emit('allocateSlot', slot);
    }

    socket.on('updateCounts', (data) => {
      const { counts, limits } = data;
      for (let slot in counts) {
        const taken = counts[slot];
        const limit = limits[slot];
        const remaining = limit - taken;

        document.getElementById(`count-${slot}`).innerText = taken;
        const remElem = document.getElementById(`rem-${slot}`);
        remElem.innerText = remaining;
        
        const btn = document.getElementById(`btn-${slot}`);
        if (remaining <= 0) {
          remElem.className = 'remaining full';
          btn.innerText = 'SLOT FULL';
          btn.disabled = true;
        } else {
          remElem.className = 'remaining';
          btn.innerText = `+ Assign ${slot} PM Slot`;
          btn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
