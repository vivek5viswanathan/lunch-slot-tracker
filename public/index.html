<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onam Sadya - Lunch Slot Allocator</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --kasavu-gold: #D4AF37;
      --cream-white: #FCFBF7;
      --deep-gold: #B8860B;
      --marigold-orange: #E65100;
      --marigold-yellow: #FFB300;
      --leaf-green: #2E7D32;
      --full-red: #C62828;
      --text-dark: #332A15;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--cream-white);
      color: var(--text-dark);
      margin: 0;
      padding: 16px;
      text-align: center;
      border-top: 8px solid var(--kasavu-gold);
    }

    .header-container {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--kasavu-gold);
    }

    .festive-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--marigold-orange);
      margin: 6px 0 2px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: var(--leaf-green);
      margin: 0;
    }

    .version-badge {
      font-size: 11px;
      color: #777;
      margin-top: 6px;
      font-weight: 500;
    }

    .slot-card {
      background: white;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
      border: 2px solid var(--kasavu-gold);
      position: relative;
      overflow: hidden;
    }

    .slot-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--marigold-yellow), var(--marigold-orange), var(--leaf-green));
    }

    .slot-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .count-display {
      font-size: 14px;
      margin-bottom: 14px;
      color: #555;
    }

    .remaining {
      font-weight: 800;
      font-size: 17px;
      color: var(--leaf-green);
    }

    .remaining.full {
      color: var(--full-red);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button.btn-assign {
      flex: 3;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--marigold-yellow), var(--marigold-orange));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(230, 81, 0, 0.25);
      text-transform: uppercase;
    }

    button.btn-unassign {
      flex: 1;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--full-red);
      background: #FFEBEE;
      border: 1px solid var(--full-red);
      border-radius: 8px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      background: #E0E0E0 !important;
      color: #9E9E9E !important;
      border: 1px solid #CCC !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    .meta-footer {
      font-size: 11px;
      color: #888;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="subtitle">🌼 Happy Onam 🌼</div>
    <div class="festive-title">Onam Sadya Tokens</div>
    <div class="version-badge">App v1.2 • Last Sync: <span id="last-updated">--:--:--</span></div>
  </div>

  <div class="slot-card">
    <div class="slot-title">12:30 PM Batch</div>
    <div class="count-display">
      <span id="rem-12:30" class="remaining">100</span> slots left (<span id="count-12:30">0</span>/100)
    </div>
    <div class="btn-group">
      <button id="btn-12:30" class="btn-assign" onclick="assignSlot('12:30')">+ Assign</button>
      <button id="unbtn-12:30" class="btn-unassign" onclick="unassignSlot('12:30')">- Unassign</button>
    </div>
  </div>

  <div class="slot-card">
    <div class="slot-title">1:00 PM Batch</div>
    <div class="count-display">
      <span id="rem-1:00" class="remaining">100</span> slots left (<span id="count-1:00">0</span>/100)
    </div>
    <div class="btn-group">
      <button id="btn-1:00" class="btn-assign" onclick="assignSlot('1:00')">+ Assign</button>
      <button id="unbtn-1:00" class="btn-unassign" onclick="unassignSlot('1:00')">- Unassign</button>
    </div>
  </div>

  <div class="slot-card">
    <div class="slot-title">1:30 PM Batch</div>
    <div class="count-display">
      <span id="rem-1:30" class="remaining">100</span> slots left (<span id="count-1:30">0</span>/100)
    </div>
    <div class="btn-group">
      <button id="btn-1:30" class="btn-assign" onclick="assignSlot('1:30')">+ Assign</button>
      <button id="unbtn-1:30" class="btn-unassign" onclick="unassignSlot('1:30')">- Unassign</button>
    </div>
  </div>

  <div class="meta-footer">Live WebSockets • Real-Time Synchronization</div>

  <script>
    const socket = io();

    function assignSlot(slot) {
      socket.emit('allocateSlot', slot);
    }

    function unassignSlot(slot) {
      socket.emit('unassignSlot', slot);
    }

    socket.on('updateCounts', (data) => {
      const { counts, limits } = data;
      const now = new Date();
      document.getElementById('last-updated').innerText = now.toLocaleTimeString();

      for (let slot in counts) {
        const taken = counts[slot];
        const limit = limits[slot];
        const remaining = limit - taken;

        document.getElementById(`count-${slot}`).innerText = taken;
        const remElem = document.getElementById(`rem-${slot}`);
        remElem.innerText = remaining;
        
        const assignBtn = document.getElementById(`btn-${slot}`);
        const unassignBtn = document.getElementById(`unbtn-${slot}`);

        // Handle Assign Button state
        if (remaining <= 0) {
          remElem.className = 'remaining full';
          assignBtn.innerText = 'SLOT FULL';
          assignBtn.disabled = true;
        } else {
          remElem.className = 'remaining';
          assignBtn.innerText = '+ Assign';
          assignBtn.disabled = false;
        }

        // Handle Unassign Button state (Disable if count is 0)
        unassignBtn.disabled = (taken <= 0);
      }
    });
  </script>
</body>
</html>
